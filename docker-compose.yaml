# Lokaler Test der Seite vor dem Deploy auf GitHub Pages.
#   docker compose up -d   ->  http://localhost:8080
#   docker compose down
#
# Das Repository ist schreibgeschützt eingehängt. Änderungen an HTML und
# Bildern sind nach einem Neuladen im Browser sofort sichtbar. Änderungen an
# src/css und src/js brauchen vorher "npm run build". Der Container muss nie
# neu gestartet werden.
services:
  web:
    image: nginx:alpine
    container_name: mkcs-test
    ports:
      - "8080:80"
    volumes:
      - .:/usr/share/nginx/html:ro
